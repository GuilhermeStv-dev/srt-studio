name: macOS packaging

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'engine/**'
      - 'scripts/build-engine.sh'
      - 'scripts/build-brand-icon.mjs'
      - 'scripts/engine_entry.py'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/desktop/**'
      - '.github/workflows/macos-packaging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-app:
    # macos-14 = Apple Silicon (arm64), mesma arquitetura dos Macs M1/M2/M3.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create project venv
        run: python -m venv .venv
      - name: Install desktop dependencies
        run: npm install
      - name: Build macOS app
        run: npm run make:mac
      - name: Verify app bundle
        run: |
          set -x
          app=$(find release/forge -maxdepth 3 -name 'SRTX.app' -path '*darwin-arm64*' | head -1)
          test -n "$app" || { echo 'SRTX.app não foi gerado.'; exit 1; }
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/SRTX" | grep -q arm64
          test -x "$app/Contents/Resources/srt-studio-engine/srt-studio-engine"
          # O packager copia o ícone do app como electron.icns.
          cmp build/branding/srtx.icns "$app/Contents/Resources/electron.icns"
          echo "App: $app"
      - name: Smoke test standalone engine (transcription + UTF-8)
        run: |
          engine="$PWD/dist/engine/srt-studio-engine/srt-studio-engine"
          "$engine" runtime | tee runtime.json
          grep -q '"device": "cpu"' runtime.json

          say -o "$RUNNER_TEMP/smoke.wav" --file-format=WAVE --data-format=LEI16@16000 \
            'Hello, this is a subtitle test for the studio.'
          "$engine" transcribe "$RUNNER_TEMP/smoke.wav" --model tiny --language en > transcript.json 2> transcript.err
          cat transcript.err
          if grep -q 'invalid choice' transcript.err; then
            echo 'Engine congelado não tratou subprocessos do multiprocessing.'; exit 1
          fi
          python -c "import json; r=json.load(open('transcript.json')); assert r.get('ok') and r['captions'], r; print('Transcrição OK:', len(r['captions']), 'captions')"

          out="$RUNNER_TEMP/¿prueba-á.srt"
          printf '%s' '{"captions":[{"text":"¿Quién está acá?","start":0.0,"end":1.0}]}' \
            | "$engine" export-srt --output "$out" | tee export.json
          grep -q '¿prueba-á.srt' export.json
          grep -q '¿Quién está acá?' "$out"
          echo 'Engine standalone preservou UTF-8 em stdin, stdout e SRT.'
      - name: Upload macOS app artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: srtx-macos-arm64
          path: release/forge/make/zip/darwin/arm64/*.zip
          if-no-files-found: error
      - name: Publish macOS app to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_path=$(ls release/forge/make/zip/darwin/arm64/*.zip | head -1)
          cp "$zip_path" SRTX-macOS-arm64.zip
          # O workflow Windows pode criar a mesma release em paralelo.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "SRTX $GITHUB_REF_NAME" --notes 'Build interno do SRTX.' --prerelease \
            || true
          gh release upload "$GITHUB_REF_NAME" SRTX-macOS-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/engine -p "test_*.py" -v
      - run: python -m engine.cli health

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Verify SRTX branding in production renderer
        shell: bash
        run: |
          grep -R -F "Guilherme Estevão Editor" apps/desktop/out/renderer
          grep -R -F "SRTX" apps/desktop/out/renderer
          grep -R -F "#6C3BFF" apps/desktop/out/renderer
